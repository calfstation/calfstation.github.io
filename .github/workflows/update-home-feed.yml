name: Update CALF home feed

on:
  workflow_dispatch:
  schedule:
    # 한국 시간 기준 매 시각 03/13/23/33/43/53분 부근.
    # GitHub scheduled workflow는 상황에 따라 약간 지연될 수 있습니다.
    - cron: '3,13,23,33,43,53 * * * *'
  push:
    paths:
      - 'scripts/build_home_feed.py'
      - '.github/workflows/update-home-feed.yml'

permissions:
  contents: write

concurrency:
  group: calf-home-feed
  cancel-in-progress: true

jobs:
  build-home-feed:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install parser
        run: |
          python -m pip install --disable-pip-version-check requests beautifulsoup4

      - name: Build home-feed.json
        run: |
          python scripts/build_home_feed.py

           - name: Commit feed if changed
        run: |
          git add home-feed.json

          if git diff --cached --quiet; then
            echo "home-feed.json unchanged"
            exit 0
          fi

          git config user.name "CALF STATION Feed Bot"
          git config user.email "actions@users.noreply.github.com"

          git commit -m "chore: refresh CALF home feed"
          git push

          git add home-feed.json
          git commit -m "chore: refresh CALF home feed"
          git push
