name: Update CALF home feed

on:
  workflow_dispatch:
  schedule:
    # 한국 시간 기준 매 시각 03/13/23/33/43/53분 부근.
    # GitHub scheduled workflow는 상황에 따라 약간 지연될 수 있습니다.
    - cron: '3,13,23,33,43,53 * * * *'
  push:
    paths:
      - 'scripts/build_home_feed.py'
      - '.github/workflows/update-home-feed.yml'

permissions:
  contents: write

concurrency:
  group: calf-home-feed
  cancel-in-progress: true

jobs:
  build-home-feed:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install parser
        run: |
          python -m pip install --disable-pip-version-check requests beautifulsoup4

      - name: Refresh and publish home-feed.json
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "CALF STATION Feed Bot"
          git config user.email "actions@users.noreply.github.com"

          # 저장소가 작업 도중 갱신되더라도 최신 main 기준으로 다시 만들고
          # push 충돌 시 최대 3회 재시도합니다.
          for attempt in 1 2 3; do
            echo "=== feed publish attempt ${attempt}/3 ==="

            git fetch origin main
            git reset --hard origin/main

            python scripts/build_home_feed.py

            git add home-feed.json

            if git diff --cached --quiet; then
              echo "home-feed.json unchanged"
              exit 0
            fi

            git commit -m "chore: refresh CALF home feed"

            if git push origin HEAD:main; then
              echo "home-feed.json published"
              exit 0
            fi

            echo "Remote changed while publishing. Retrying from latest main..."
            sleep 2
          done

          echo "Failed to publish home-feed.json after 3 attempts."
          exit 1
